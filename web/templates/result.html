<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Proxy Manager</title>
  <style>{{ APP_CSS|safe }}</style>
</head>
<body class="result-body">
  <div class="result-card">
    <div class="ric">{{ '✅' if ok else '⚠️' }}</div>
    <h1>{{ title }}</h1>
    <p class="{{ 'result-ok' if ok else 'result-err' }}">{{ message }}</p>
    <a class="btn primary block" href="/">返回面板</a>
  </div>
</body>
</html>
