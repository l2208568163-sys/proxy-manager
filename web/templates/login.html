<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy Manager 登录</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="box">
    <h1>Proxy Manager v3.2.6</h1>
    <div class="card login-card">
      <h2>登录</h2>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input name="username" placeholder="用户名" autocomplete="username">
        <input name="password" type="password" placeholder="密码" autocomplete="current-password">
        <button type="submit">登录</button>
      </form>
    </div>
    <p class="warn">⚠ 公网暴露面板前，请确认已配置 data/web.env 中的强密码。</p>
  </div>
</body>
</html>
