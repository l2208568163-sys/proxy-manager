<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Proxy Manager</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <h1>Proxy Manager</h1>
    <p class="login-sub">服务器管理控制台 · v{{ version }}</p>
    {% if no_creds %}
      <p class="err">未检测到 data/web.env，登录已被拒绝。<br>请在服务器运行 <code>modules/webpanel.sh reset</code> 生成随机口令。</p>
    {% elif error %}
      <p class="err">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>用户名
        <input name="username" autocomplete="username" required>
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary full" type="submit">登 录</button>
    </form>
  </div>
</div>
</body>
</html>
