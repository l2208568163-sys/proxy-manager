# Example client profile. Replace every <...> value before using it.
mixed-port: 7890
allow-lan: false
mode: rule
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver: [https://1.1.1.1/dns-query, https://dns.google/dns-query]
proxies:
  - name: "Reality"
    type: vless
    server: "<SERVER>"
    port: 443
    uuid: "<UUID>"
    encryption: "none"
    network: tcp
    tls: true
    flow: xtls-rprx-vision
    servername: "<SNI>"
    client-fingerprint: chrome
    reality-opts:
      public-key: "<PUBLIC_KEY>"
      short-id: "<SHORT_ID>"
proxy-groups:
  - {name: Proxy, type: select, proxies: [Reality, DIRECT]}
rules: [MATCH,Proxy]
